<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISCUIT DESIGN DEPARTMENT. | KANAZAWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<section class="hero">

      <div class="hero-slide"><img src="assets/img/slide-fluffy.jpg" alt="Hi Fluffy Girl! 誌面" class="hero-image"></div>

  </div>

  <div class="hero-text">
    <img src="assets/img/logo-biscuit.png" alt="BISCUIT" class="hero-title-image hero-title-image--biscuit">
    <img src="assets/img/logo-department.png" alt="DESIGN DEPARTMENT." class="hero-title-image hero-title-image--department">
    <p class="hero-text-sub">KANAZAWA</p>
  </div>
</section>

<section class="section-2">
  <div class="hero-frame">
    <img src="assets/img/section2.jpg" alt="空と雲、木々の写真" class="hero-image kenburns">

<section class="section-3">
  <div class="hero-frame hero-frame--white">

  </div>
</section>

<section class="section-4">
  <div class="hero-frame">
    <img src="assets/img/section4.jpg" alt="洗面台に置かれたジーンズと小物" class="hero-image kenburns">
